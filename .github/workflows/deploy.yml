name: Deploy to GitHub Pages

# Dieselbe Kette wie lokal vor jedem Commit: check → test → sim → build → budget.
# Ist eines davon rot, erreicht nichts die Live-Seite.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm install`, nicht `npm ci`: das Lockfile entsteht unter Windows und
      # laesst Linux-Optionals aus, woran `npm ci` beim Sync scheitert.
      - run: npm install

      - name: Typen
        run: npm run check

      - name: Tests (inkl. der zwoelf Content-Validierungen)
        run: npm run test

      - name: Simulator
        run: node tools/simulate.mjs --runs 200

      - name: Build
        run: npx vite build

      - name: Performance-Budget
        run: node tools/check-budget.mjs

      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
